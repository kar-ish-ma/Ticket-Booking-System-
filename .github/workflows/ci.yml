# ci.yml
#
# Owns continuous integration: install, lint, and (once tests exist) run them against a real
# Postgres instance. Runs on GitHub's Linux runners, where a service container is a normal,
# well-supported thing to spin up for the lifetime of the job -- it never touches the Windows,
# 4GB, no-Docker dev machine this project is otherwise built for (docs/PROJECT_PROMPT.md §3.0).
#
# WHY plain inline fake credentials here instead of GitHub Secrets:
# Secrets configured on this repo don't carry over to a fork, and a grader is expected to clone
# or fork this project to run it themselves. If DATABASE_URL/JWT secrets lived only in this
# repo's Secrets settings, CI would go red for anyone except the original owner -- through no
# fault of their own. The values below point at a Postgres container that exists only for the
# few minutes this job runs and is destroyed after, so there's nothing here that actually needs
# to stay confidential. Plain YAML is the correct tool for a throwaway value, not a shortcut.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Exists now so this workflow doesn't need revisiting once Phase 1+ adds real tests against
    # ticket_booking_test -- see docs/BUILD_LOG.md Decisions Ledger D-20.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ticket_booking_test
      # Fake, CI-only values -- long enough and distinct enough to satisfy server/src/config/
      # env.js's Zod schema (min 32 chars; QR_SIGNING_SECRET must differ from both JWT secrets,
      # per D-10) without being anything a real deployment would ever use.
      JWT_ACCESS_SECRET: ci-fake-access-secret-not-real-000
      JWT_REFRESH_SECRET: ci-fake-refresh-secret-not-real-0
      QR_SIGNING_SECRET: ci-fake-qr-secret-not-real-00000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # WHY --if-present instead of a bare `npm test`:
      # No test runner exists yet (Vitest lands with the first real tests, Phase 1 onward). A
      # bare `npm test` would fail the build over a missing script rather than a real problem;
      # --if-present keeps this step green until then and needs no changes once a test script
      # actually exists. Runs both the unit config (tests/unit/**) and the e2e config
      # (tests/e2e/**, against the Postgres service above) -- see server/vitest.unit.config.js
      # and vitest.e2e.config.js.
      - run: npm test --if-present

      # WHY a separate 3x loop instead of trusting one green run: docs/PROJECT_PROMPT.md §6.6's
      # own risk register calls out "concurrency tests flaky in CI" -- a race test that passes
      # once could still be racy in a way a single run doesn't happen to expose. Running the
      # headline suite (50 parallel holds, the overlapping-set race, the D-14 OFFER_RESERVED
      # check) three times in a row is the concrete falsification CLAUDE.md's testing standard
      # asks for: exact counts, every time, not "seemed fine once."
      - name: Concurrency suite (3x, to catch flakiness)
        run: |
          for i in 1 2 3; do
            echo "--- test:concurrency run $i/3 ---"
            npm run test:concurrency
          done
